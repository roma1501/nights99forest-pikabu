    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        /* Загрузка: ночной лес у костра (без картинок — CSS и встроенный SVG). Шрифт — Rubik, как у интерфейса. */
        @font-face { font-family: 'Rubik'; src: url('assets/fonts/rubik.ttf?v=0.1.0') format('truetype'); font-weight: 300 900; font-display: swap; }
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(180deg, #0b1820 0%, #0f2324 46%, #0d1a16 70%, #090d0b 100%);
            z-index: 1000;
            font-family: 'Rubik', system-ui, sans-serif;
        }
        .ls-moon { position: absolute; right: 16%; top: 11%; width: clamp(34px, 7vh, 64px); height: clamp(34px, 7vh, 64px); border-radius: 50%; background: radial-gradient(circle at 38% 36%, #f6eedb, #ddcfae 70%); box-shadow: 0 0 0 10px rgba(232, 220, 188, .05), 0 0 60px rgba(232, 220, 188, .18); }
        .ls-fog { position: absolute; left: 0; right: 0; bottom: 18%; height: 22%; background: linear-gradient(180deg, transparent, rgba(160, 182, 170, .09) 55%, transparent); }
        .ls-forest { position: absolute; left: 0; bottom: 0; width: 100%; height: clamp(110px, 34vh, 300px); }
        .ls-far { fill: #10211d; bottom: 7%; height: clamp(90px, 30vh, 260px); }
        .ls-near { fill: #070b09; }
        .ls-center { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.6vh, 14px); padding: 0 16px; max-width: 100%; }
        .ls-fire { position: relative; width: clamp(70px, 17vh, 130px); height: clamp(70px, 17vh, 130px); }
        .ls-fire svg { width: 100%; height: 100%; overflow: visible; }
        .ls-glow { position: absolute; left: 50%; bottom: -6%; width: 260%; height: 60%; transform: translateX(-50%); background: radial-gradient(ellipse at 50% 60%, rgba(232, 132, 59, .26), transparent 70%); pointer-events: none; }
        .ls-fl { transform-box: fill-box; transform-origin: 50% 100%; animation: lsFlick 1.1s ease-in-out infinite alternate; }
        .ls-fl.f2 { animation-duration: .8s; animation-delay: -.3s; }
        .ls-fl.f3 { animation-duration: .6s; animation-delay: -.5s; }
        @keyframes lsFlick { 0% { transform: scale(1, 1) skewX(0deg); } 35% { transform: scale(.94, 1.08) skewX(3deg); } 70% { transform: scale(1.04, .94) skewX(-2deg); } 100% { transform: scale(.97, 1.04) skewX(1deg); } }
        .ls-ember { position: absolute; left: 50%; bottom: 46%; width: 4px; height: 4px; border-radius: 1px; background: #f6c35c; opacity: 0; animation: lsEmber 2.6s linear infinite; }
        .ls-ember:nth-child(2) { margin-left: -14px; animation-delay: -.7s; animation-duration: 2.2s; }
        .ls-ember:nth-child(3) { margin-left: 10px; animation-delay: -1.4s; animation-duration: 3s; }
        .ls-ember:nth-child(4) { margin-left: -4px; animation-delay: -2s; animation-duration: 2.4s; background: #e8843b; }
        .ls-ember:nth-child(5) { margin-left: 18px; animation-delay: -.3s; animation-duration: 2.8s; background: #e8843b; }
        @keyframes lsEmber { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(14px, -120px) rotate(160deg); opacity: 0; } }
        #loading-title { margin: 0; font: 900 clamp(24px, 5.4vh, 46px)/1.08 'Rubik', system-ui, sans-serif; letter-spacing: .01em; color: #f2e8d2; text-align: center; max-width: 88vw; text-shadow: 0 4px 0 #8a3d17, 0 6px 0 #120e0a; -webkit-text-stroke: 1px #120e0a; paint-order: stroke fill; }
        .ls-meter { display: flex; align-items: center; gap: 12px; margin-top: clamp(2px, 1vh, 8px); }
        .loading-bar {
            position: relative;
            width: min(300px, 64vw);
            height: 14px;
            background: #17120d;
            border: 2px solid #120e0a;
            border-radius: 5px;
            box-shadow: inset 0 0 0 1px rgba(242, 232, 210, .08), 0 3px 0 rgba(0, 0, 0, .5);
            overflow: hidden;
        }
        .loading-bar::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), rgba(0, 0, 0, .35) calc(10% - 2px) 10%); pointer-events: none; }
        .loading-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #9b4219, #e8843b 75%, #f6c35c);
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, .18);
            transition: width 0.3s ease;
        }
        #loading-percent { min-width: 3.2em; font: 800 16px 'Rubik', system-ui, sans-serif; font-variant-numeric: tabular-nums; color: #f2e8d2; text-align: left; }
        .loading-text {
            font: 500 14px 'Rubik', system-ui, sans-serif;
            letter-spacing: .04em;
            color: #cdbf9f;
            text-align: center;
            min-height: 1em;
        }
        #loading-retry { margin-top: 4px; padding: 10px 26px; border: 2px solid #120e0a; border-radius: 9px; background: #557f3e; color: #f2e8d2; font: 700 16px 'Rubik', system-ui, sans-serif; cursor: pointer; box-shadow: 0 4px 0 #2e4a22, 0 6px 0 #120e0a; outline: 1.5px dashed rgba(242, 232, 210, .3); outline-offset: -6px; }
        #loading-retry:active { transform: translateY(4px); box-shadow: 0 0 0 #2e4a22, 0 2px 0 #120e0a; }
        @media (prefers-reduced-motion: reduce) { .ls-fl, .ls-ember { animation: none; } .ls-ember { display: none; } }
        @media (orientation: landscape) and (max-height: 420px) { .ls-moon { top: 8%; } .ls-center { gap: 4px; } }
    </style>

    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
